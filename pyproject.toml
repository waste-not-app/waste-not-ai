[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastenot-ai"
version = "0.1.0"
description = "WasteNot private YOLO inference and Gemini decision workers"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "Pillow==13.0.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.183"]
worker = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.33"]
test = ["pytest==9.2.0", "jsonschema==4.26.0", "openapi-spec-validator==0.9.0"]

[project.scripts]
wastenot-ai = "wastenot_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wastenot_ai = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.ttf", "web/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["annotations", "benchmarks", "evaluations", "examples", "guide-proposals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "BLE", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
"scripts/**" = ["S101", "S105", "S310", "S311", "S603", "S607", "B007", "B905", "BLE001"]
"deploy/**" = ["S310", "S603", "S607", "BLE001"]
"audit_dependencies.py" = ["S603", "S607"]
"src/wastenot_ai/{worker,http_api,demo}.py" = ["BLE001"]
"src/wastenot_ai/openapi_export.py" = ["S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["wastenot_ai"]

[tool.ruff.format]
quote-style = "preserve"
