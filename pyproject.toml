[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastenot-ai"
version = "0.1.0"
description = "WasteNot private YOLO inference and Gemini decision workers"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "Pillow==13.0.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.183"]
worker = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.33"]
test = ["pytest==9.2.0", "jsonschema==4.26.0", "openapi-spec-validator==0.9.0"]

[project.scripts]
wastenot-ai = "wastenot_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wastenot_ai = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.ttf", "web/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
