name: AI Service CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wastenot-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Test & Model Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install pytest==9.2.0 pip-audit==2.10.1 ruff jsonschema openapi-spec-validator Pillow

      - name: Code Quality & Syntax Check (Ruff)
        run: |
          ruff check --ignore F401 --select E9,F src tests

      - name: Security & Dependency Audit
        run: |
          python audit_dependencies.py

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Verify Model Manifest
        run: |
          python -c '
          import json, pathlib, re
          m = json.loads(pathlib.Path("model.json").read_text())
          assert "model_version" in m and "sha256" in m and "source_url" in m
          assert re.fullmatch(r"[a-f0-9]{64}", m["sha256"]), "Invalid SHA-256 in model.json"
          print("Model manifest verified:", m["model_version"])
          '

      - name: Package Release Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' -czf "dist/wastenot-ai-${{ github.sha }}.tar.gz" .

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-${{ github.sha }}
          path: dist/wastenot-ai-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to MLOps Host (VM)
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: wastenot-ai-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-release-${{ github.sha }}
          path: dist

      - name: Prepare SSH Identity
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/wastenot-ai-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/wastenot-ai-known-hosts"

      - name: Deploy Release to Host VM
        env:
          DEPLOY_HOST: ${{ vars.VM_HOST }}
          DEPLOY_PORT: ${{ vars.VM_PORT }}
          DEPLOY_USER: ${{ vars.VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          SSH_CMD="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$RUNNER_TEMP/wastenot-ai-known-hosts \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i $RUNNER_TEMP/wastenot-ai-key -p $DEPLOY_PORT"

          echo "==> Uploading release tarball to VM..."
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /home/$DEPLOY_USER/ai-releases"
          cat "dist/wastenot-ai-$RELEASE_SHA.tar.gz" | $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "cat > /home/$DEPLOY_USER/ai-releases/wastenot-ai-$RELEASE_SHA.tar.gz"

          echo "==> Deploying release to /opt/wastenot-ai/releases/$RELEASE_SHA..."
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $RELEASE_SHA" <<'EOF'
            set -euo pipefail
            SHA="$1"
            RELEASE_DIR="/opt/wastenot-ai/releases/$SHA"
            sudo mkdir -p "$RELEASE_DIR"
            sudo tar -xzf "/home/dev/ai-releases/wastenot-ai-$SHA.tar.gz" -C "$RELEASE_DIR"
            sudo chown -R root:root "$RELEASE_DIR"

            # Point /opt/wastenot-ai/current to the active release
            sudo ln -sfn "$RELEASE_DIR" /opt/wastenot-ai/current-new
            sudo mv -Tf /opt/wastenot-ai/current-new /opt/wastenot-ai/current

            # Backward compatibility with /opt/wastenot/current/python
            if [ -d /opt/wastenot/current ]; then
              sudo mkdir -p /opt/wastenot/current/python
              sudo cp -r "$RELEASE_DIR/src/wastenot_ai" /opt/wastenot/current/python/ || true
              sudo cp "$RELEASE_DIR/serve.py" /opt/wastenot/current/ai-serve.py || true
            fi

            echo "==> Restarting AI worker services..."
            sudo systemctl restart wastenot-yolo wastenot-decisions
          EOF

      - name: Verify AI Worker Health
        env:
          DEPLOY_HOST: ${{ vars.VM_HOST }}
          DEPLOY_PORT: ${{ vars.VM_PORT }}
          DEPLOY_USER: ${{ vars.VM_USER }}
        run: |
          SSH_CMD="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$RUNNER_TEMP/wastenot-ai-known-hosts \
            -o ConnectTimeout=20 -i $RUNNER_TEMP/wastenot-ai-key -p $DEPLOY_PORT"

          echo "==> Verifying YOLO worker health on loopback 8091..."
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" '
            TOKEN=$(sudo grep ^AI_SERVICE_TOKEN= /etc/wastenot/ai-detection.env | cut -d= -f2-)
            curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8091/health/ready
          '

          echo "==> Verifying Decision worker health on loopback 8093..."
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" '
            TOKEN=$(sudo grep ^AI_RECOMMENDATION_TOKEN= /etc/wastenot/ai-recommendation.env | cut -d= -f2-)
            curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8093/health/ready
          '

      - name: Cleanup Temporary SSH Files
        if: always()
        run: rm -f "$RUNNER_TEMP/wastenot-ai-key" "$RUNNER_TEMP/wastenot-ai-known-hosts"
