name: AI Service CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wastenot-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Verify and Deploy AI Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked runtime and CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Check source and deploy helpers
        run: ruff check --ignore F401 --select E9,F src tests scripts deploy serve.py
      - name: Audit locked CPU dependencies
        run: python audit_dependencies.py
      - name: Check generated contracts without modifying them
        run: |
          python -m wastenot_ai.cli export-contracts --check
          python scripts/check_contracts.py contracts/v1 contracts/backend-pin.json
      - name: Run tests including failed deployment recovery
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Verify actual model bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_model.py "$RUNNER_TEMP/wastenot-model"
      - name: Package runtime release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git diff --exit-code
          python scripts/package_release.py "dist/wastenot-ai-${{ github.sha }}.tar.gz"
      - name: Prepare dedicated SSH identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/wastenot-ai-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/wastenot-ai-known-hosts"
      - name: Verify and activate release on host
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ vars.VM_HOST }}
          DEPLOY_PORT: ${{ vars.VM_PORT }}
          DEPLOY_USER: ${{ vars.VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/wastenot-ai-known-hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
            -i "$RUNNER_TEMP/wastenot-ai-key" -p "$DEPLOY_PORT")
          DEST="$DEPLOY_USER@$DEPLOY_HOST"
          STAGE=$("${SSH[@]}" "$DEST" 'mktemp -d /tmp/wastenot-ai-deploy.XXXXXXXX')
          [[ "$STAGE" =~ ^/tmp/wastenot-ai-deploy\.[a-zA-Z0-9]+$ ]]
          trap '"${SSH[@]}" "$DEST" "rm -rf -- $STAGE"' EXIT
          cat deploy/deploy.py | "${SSH[@]}" "$DEST" "cat > $STAGE/deploy.py && sudo -n install -m 0755 -o root -g root $STAGE/deploy.py /usr/local/sbin/wastenot-ai-deploy"
          cat "dist/wastenot-ai-$RELEASE_SHA.tar.gz" | "${SSH[@]}" "$DEST" 'sudo -n /usr/local/sbin/wastenot-ai-deploy'
      - name: Cleanup temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/wastenot-ai-key" "$RUNNER_TEMP/wastenot-ai-known-hosts"
