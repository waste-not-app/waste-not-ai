name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify AI Workers
    runs-on: [self-hosted, alberd-staging-ai]
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked runtime and CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Lint and security rules
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Audit locked CPU dependencies
        run: python audit_dependencies.py
      - name: Check generated contracts without modifying them
        run: |
          python -m wastenot_ai.cli export-contracts --check
          python scripts/check_contracts.py contracts/v1 contracts/backend-pin.json
      - name: Run tests including failed deployment recovery
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Verify actual model bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_model.py "$RUNNER_TEMP/wastenot-model"
